common:
    lid_topic: "/livox/lidar2"
    imu_topic: "/livox/imu"
    time_sync_en: false
    time_offset_lidar_to_imu: 0.0

preprocess:
    lidar_type: 1
    scan_line: 4
    scan_rate: 10
    timestamp_unit: 3
    blind: 0.3

mapping:
    acc_cov: 0.02
    gyr_cov: 0.02
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    fov_degree: 360
    det_range: 40.0
    extrinsic_est_en: false
    extrinsic_T: [0.011, 0.02329, -0.04412]
    extrinsic_R: [1, 0, 0,
                  0, 1, 0,
                  0, 0, 1]

publish:
    path_en: false
    scan_publish_en: true
    dense_publish_en: false
    scan_bodyframe_pub_en: false

pcd_save:
    pcd_save_en: false
    interval: -1
