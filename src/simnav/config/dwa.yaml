DWAPlannerROS:
  odom_topic: /simnav/odom
  max_vel_x: 0.60
  min_vel_x: 0.45
  max_vel_y: 0.0
  min_vel_y: 0.0
  max_vel_trans: 0.60
  min_vel_trans: 0.45
  max_vel_theta: 0.45
  min_vel_theta: 0.12
  acc_lim_x: 0.60
  acc_lim_y: 0.0
  acc_lim_theta: 0.65
  acc_lim_trans: 0.50
  xy_goal_tolerance: 0.18
  yaw_goal_tolerance: 0.15
  latch_xy_goal_tolerance: true
  sim_time: 2.0
  sim_granularity: 0.05
  vx_samples: 12
  vy_samples: 1
  vtheta_samples: 20
  path_distance_bias: 40.0
  goal_distance_bias: 20.0
  occdist_scale: 0.03
  forward_point_distance: 0.25
  stop_time_buffer: 0.20
  scaling_speed: 0.25
  max_scaling_factor: 0.20
  publish_traj_pc: false
  publish_cost_grid_pc: false
  prune_plan: true
  oscillation_reset_dist: 0.10
